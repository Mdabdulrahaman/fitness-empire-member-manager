<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111315">
<title>Fitness Empire · Invoice</title>
<style>
:root{--gold:#c99a42;--ink:#17191b;--muted:#687078;--line:#e4e5e6}
*{box-sizing:border-box}
body{margin:0;background:#f1f2f3;color:var(--ink);font:15px Arial,Helvetica,sans-serif;padding:28px 14px}
.wrap{max-width:760px;margin:0 auto}
.toolbar{display:flex;justify-content:flex-end;margin:0 0 14px}
button{border:0;border-radius:8px;background:var(--gold);color:#17130b;font-weight:700;padding:12px 18px;cursor:pointer}
.invoice{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px #0000000d}
.top{padding:28px 34px 22px;border-bottom:4px solid var(--gold);display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:100px;height:76px;object-fit:contain}
h1{font-size:24px;letter-spacing:2px;margin:0 0 7px}
.gym-meta{font-size:12px;line-height:1.6;color:var(--muted)}
.tag{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:800}
.body{padding:30px 34px}
.invoice-head{display:flex;justify-content:space-between;gap:18px;margin-bottom:28px}
.invoice-head h2{margin:0 0 8px;font-size:22px}
.small{font-size:12px;color:var(--muted);line-height:1.7}
.member{background:#f7f7f6;border:1px solid var(--line);border-radius:9px;padding:16px;margin-bottom:22px}
.member strong{display:block;font-size:17px;margin-bottom:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.item{padding:13px 0;border-bottom:1px solid var(--line)}
.label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.value{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.total{margin-top:22px;background:#17191b;color:#fff;border-radius:9px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.total .label{color:#d6d6d6;margin:0}
.amount{font-size:24px;color:#e2b75f;font-weight:800}
.note{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.7}
.footer{border-top:1px solid var(--line);padding:17px 34px;text-align:center;font-size:11px;color:var(--muted)}
.state{background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px;text-align:center}
.state h2{margin-top:0}
@media(max-width:560px){body{padding:12px 8px}.top{padding:22px 18px;align-items:flex-start}.brand{gap:10px}.logo{width:72px;height:60px}h1{font-size:18px}.body{padding:22px 18px}.footer{padding:16px 18px}.invoice-head{flex-direction:column}.grid{grid-template-columns:1fr}.toolbar{margin-bottom:10px}}
@media print{body{background:#fff;padding:0}.wrap{max-width:none}.toolbar{display:none}.invoice{border:0;border-radius:0;box-shadow:none}.state{border:0}}
</style>
</head>
<body>
<main class="wrap">
  <div class="toolbar"><button id="printBtn" type="button" onclick="window.print()" hidden>Download / Print invoice</button></div>
  <section id="content" class="state"><h2>Loading invoice…</h2><p class="small">Please wait while we securely retrieve your invoice.</p></section>
</main>
<script>
(() => {
  const API = 'https://hoddoswadbpwveiolpfc.supabase.co/functions/v1/invoice-api';
  const $ = (id) => document.getElementById(id);
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const dateText = (value) => {
    if (!value) return '—';
    const d = new Date(value + (String(value).length === 10 ? 'T00:00:00' : ''));
    return Number.isNaN(d.getTime()) ? '—' : d.toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
  };
  const money = (value) => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(value)||0);
  function message(title, detail) {
    $('content').innerHTML = '<h2>' + escapeHtml(title) + '</h2><p class="small">' + escapeHtml(detail) + '</p>';
  }
  async function load() {
    const token = new URLSearchParams(location.search).get('token');
    if (!token || token.length < 40) { message('Invalid invoice link','Please use the complete invoice link shared by Fitness Empire.'); return; }
    try {
      const response = await fetch(API + '?token=' + encodeURIComponent(token), {method:'GET',cache:'no-store',headers:{'Accept':'application/json'}});
      if (response.status === 410) { message('Invoice link expired','This invoice link has expired. Please contact Fitness Empire if you need another copy.'); return; }
      let result;
      try { result = await response.json(); } catch { throw new Error('The invoice service returned an unreadable response.'); }
      if (!response.ok || !result.success || !result.invoice) throw new Error(result.error || 'Invoice not found or the link is invalid.');
      const i = result.invoice;
      $('content').className = 'invoice';
      $('content').innerHTML = `
        <header class="top">
          <div class="brand">
            <img class="logo" src="fitness-empire-logo.jpg" alt="Fitness Empire logo" onerror="this.style.display='none'">
            <div><h1>FITNESS EMPIRE</h1><div class="gym-meta">Saligrama Road, Next To A L Kalyana Mantapa, Bheriya<br>Phone: 8123689266 / 8951640367</div></div>
          </div>
          <div class="tag">OFFICIAL RECEIPT</div>
        </header>
        <div class="body">
          <div class="invoice-head">
            <div><h2>Membership Invoice</h2><div class="small">Thank you for choosing Fitness Empire.</div></div>
            <div class="small"><strong>Invoice No:</strong> ${escapeHtml(i.invoice_number)}<br><strong>Invoice Date:</strong> ${escapeHtml(dateText(i.created_at))}</div>
          </div>
          <div class="member"><span class="label">Billed to</span><strong>${escapeHtml(i.member_name)}</strong><span class="small">WhatsApp: ${escapeHtml(i.member_phone || '—')}</span></div>
          <div class="grid">
            <div class="item"><span class="label">Membership plan</span><span class="value">${escapeHtml(i.plan_name)}</span></div>
            <div class="item"><span class="label">Payment method</span><span class="value">${escapeHtml(i.payment_method)}</span></div>
            <div class="item"><span class="label">Membership starts</span><span class="value">${escapeHtml(dateText(i.membership_start_date))}</span></div>
            <div class="item"><span class="label">Membership expires</span><span class="value">${escapeHtml(dateText(i.membership_end_date))}</span></div>
          </div>
          <div class="total"><div><span class="label">Amount received</span><strong>Paid to Fitness Empire</strong></div><div class="amount">${escapeHtml(money(i.amount_paid))}</div></div>
          <p class="note">Please keep this invoice for your records. This is a computer-generated membership receipt. For any questions, contact Fitness Empire using the phone numbers above.</p>
        </div>
        <footer class="footer">FITNESS EMPIRE · STRONGER EVERY DAY</footer>`;
      $('printBtn').hidden = false;
    } catch (error) {
      message('Unable to load invoice', error.message || 'Please try again later or contact Fitness Empire.');
    }
  }
  load();
})();
</script>
</body>
</html>
